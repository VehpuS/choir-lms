name: Deploy Mobile Web to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy'
        required: true
        default: main
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_SCHEME: ${{ vars['EXPO_PUBLIC_APP_SCHEME'] || 'choirlms' }}
      EXPO_PUBLIC_IOS_BUNDLE_IDENTIFIER: ${{ vars['EXPO_PUBLIC_IOS_BUNDLE_IDENTIFIER'] || 'com.choirlms.mobile' }}
      EXPO_PUBLIC_ANDROID_PACKAGE: ${{ vars['EXPO_PUBLIC_ANDROID_PACKAGE'] || 'com.choirlms.mobile' }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars['EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID'] }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars['EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID'] }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars['EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID'] }}
      EXPO_PUBLIC_GOOGLE_DRIVE_SUPPORTED_MIME_TYPES: ${{ vars['EXPO_PUBLIC_GOOGLE_DRIVE_SUPPORTED_MIME_TYPES'] || 'audio/mpeg,audio/mp4,audio/x-m4a,audio/wav,audio/x-wav,audio/aac,audio/flac,audio/ogg' }}
      EXPO_PUBLIC_GOOGLE_DRIVE_SUPPORTED_EXTENSIONS: ${{ vars['EXPO_PUBLIC_GOOGLE_DRIVE_SUPPORTED_EXTENSIONS'] || 'mp3,m4a,wav,aac,flac,ogg' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.ref || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - name: Validate required web environment variables
        run: |
          missing_variables=0

          for variable_name in EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error title=Missing required web environment variable::${variable_name} must be configured for the GitHub Pages export."
              missing_variables=1
            fi
          done

          if [[ "$missing_variables" -ne 0 ]]; then
            exit 1
          fi

      - run: npm ci

      - name: Export mobile web app
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: npm exec -- nx run mobile-rehearsal-player:build

      - name: Add single-page app fallback
        run: cp packages/mobile-rehearsal-player/dist/index.html packages/mobile-rehearsal-player/dist/404.html

      - name: Disable Jekyll processing
        run: touch packages/mobile-rehearsal-player/dist/.nojekyll

      - name: Archive Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory packages/mobile-rehearsal-player/dist \
            -cvf "$RUNNER_TEMP/mobile-web-pages.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/mobile-web-pages.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
