name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Format check (PR scope)
        if: github.event_name == 'pull_request'
        run: npm exec -- nx format:check --base=origin/main --head=HEAD

      - name: Affected checks (PR scope)
        if: github.event_name == 'pull_request'
        run: npm exec -- nx affected -t lint test build typecheck --base=origin/main --head=HEAD --outputStyle=static

      - name: Full checks (push to main)
        if: github.event_name == 'push'
        run: npm exec -- nx run-many -t lint test build typecheck --all --outputStyle=static
