name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      # Print one character per passing test and details only for failures.
      # The default reporter writes ~900 KB of TAP, and Nx exits right after
      # dumping a failed task's output, so the runner's stdout pipe (64 KB)
      # cuts it off and the actual failure never reaches the log.
      NODE_OPTIONS: --test-reporter=dot
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Validate Nx sync state
        run: npm exec -- nx sync:check

      - name: Format check (PR scope)
        if: github.event_name == 'pull_request'
        run: npm exec -- nx format:check --base=origin/main --head=HEAD

      - name: Affected checks (PR scope)
        if: github.event_name == 'pull_request'
        run: npm exec -- nx affected -t lint test typecheck build --base=origin/main --head=HEAD --outputStyle=static

      - name: Full checks (push to main)
        if: github.event_name == 'push'
        run: npm exec -- nx run-many -t lint test typecheck build --all --outputStyle=static

  # Drives the web export in Chromium against a mock library (no Google
  # sign-in), so it runs only once the unit-level checks above have passed.
  browser:
    needs: main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm exec -- nx run mobile-rehearsal-player:browser-test --outputStyle=static

      # Screenshots of each step (and of the failure, if any) for review.
      - name: Upload browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: browser-session-output/
          if-no-files-found: ignore
