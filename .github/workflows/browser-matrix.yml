name: Browser matrix

# The slow browser scenarios (`*.matrix.scenario.ts`: device profiles, CPU
# throttling, sample rates, long tracks) are opt-in so every pull request stays
# fast. Run them from the Actions tab (workflow dispatch), or put the
# `browser-matrix` label on a pull request; they then re-run on each push to it.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: browser-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'browser-matrix')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser matrix tests
        run: npm exec -- nx run mobile-rehearsal-player:browser-test-matrix --outputStyle=static

      - name: Upload browser matrix screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-matrix-screenshots
          path: browser-session-output/
          if-no-files-found: ignore
