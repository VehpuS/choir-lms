name: Browser matrix

# The slow browser scenarios (`*.matrix.scenario.ts`: device profiles, CPU
# throttling, sample rates, long tracks) are opt-in so every pull request stays
# fast. Opt in by labelling the pull request; the runs then repeat on each push:
#
#   browser-matrix          Chromium, the slow matrix lane
#   browser-matrix-webkit   WebKit, the everyday (default) lane
#   browser-matrix-firefox  Firefox, the everyday (default) lane
#
# Adding a label runs just that browser; a push runs every browser whose label
# is on. They are pull request checks, so a session can subscribe to their
# results. A scenario that needs a Chromium-only feature (the fake microphone,
# CPU throttling, the clipboard) is skipped on the others, not failed.
#
# From the Actions tab (workflow dispatch) one browser and lane can be run on
# any branch. Each browser has its own concurrency group, so runs for different
# browsers do not cancel each other.
on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run the scenarios in
        type: choice
        options: [chromium, webkit, firefox]
        default: chromium
      lane:
        description: Which scenarios to run
        type: choice
        options: [matrix, default]
        default: matrix
  pull_request:
    types: [labeled, synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: browser-matrix-${{ github.ref }}-${{ inputs.browser || github.event.label.name || 'pull-request' }}
  cancel-in-progress: true

jobs:
  # Decides which browsers this run covers, so the matrix job can be skipped
  # outright when there is nothing to run.
  plan:
    runs-on: ubuntu-latest
    outputs:
      browsers: ${{ steps.plan.outputs.browsers }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH_BROWSER: ${{ inputs.browser }}
          DISPATCH_LANE: ${{ inputs.lane }}
        run: |
          all='[
            {"browser":"chromium","lane":"matrix","label":"browser-matrix"},
            {"browser":"webkit","lane":"default","label":"browser-matrix-webkit"},
            {"browser":"firefox","lane":"default","label":"browser-matrix-firefox"}
          ]'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            browsers=$(jq -c -n --arg b "$DISPATCH_BROWSER" --arg l "$DISPATCH_LANE" '[{browser:$b,lane:$l}]')
          elif [ "$ACTION" = "labeled" ]; then
            browsers=$(echo "$all" | jq -c --arg l "$ADDED_LABEL" '[.[] | select(.label == $l)]')
          else
            browsers=$(echo "$all" | jq -c --argjson labels "$PR_LABELS" '[.[] | select(.label as $l | $labels | index($l))]')
          fi
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"
          echo "Running: $browsers"

  matrix:
    name: ${{ matrix.browser }} (${{ matrix.lane }} lane)
    needs: plan
    if: needs.plan.outputs.browsers != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.browsers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The Expo export only changes with app inputs, so most test-only pull
      # requests restore it. Nx keys its own cache entries; this keeps the
      # cache directory between runs (newest wins, any earlier one restores).
      - name: Restore the Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-browser-${{ runner.os }}-

      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Firefox and WebKit start playback only when the machine has an audio
      # output, which a CI runner lacks; a null sink gives them one. Chromium
      # does not need it (the harness taps its audio itself).
      - name: Give the browser an audio output
        if: matrix.browser != 'chromium'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_sink
          pactl set-default-sink ci_sink

      - name: Build the browser test export
        run: npm exec -- nx run mobile-rehearsal-player:build-browser-test --outputStyle=static

      - name: Browser tests (${{ matrix.lane }} lane, ${{ matrix.browser }})
        run: npx tsx tools/browser-session/run-scenarios.ts browser-session-output --lane=${{ matrix.lane }} --browser=${{ matrix.browser }}

      - name: Upload browser matrix screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-matrix-screenshots-${{ matrix.browser }}
          path: browser-session-output/
          if-no-files-found: ignore
