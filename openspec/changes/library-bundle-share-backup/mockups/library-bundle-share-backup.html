<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library bundle: share, backup, restore (mock)</title>
    <style>
      /* Nocturne tokens, copied from packages/mobile-rehearsal-player/src/app/utils/theme.ts */
      :root {
        --bg: #161826;
        --behind: #101220;
        --scrim: rgba(16, 18, 32, 0.72);
        --surface: #232532;
        --raised: #1b1e2c;
        --accent-tint: #2b2741;
        --text: #e9e9ed;
        --text2: #cfd3e5;
        --muted: #9397ab;
        --faint: #8e92a6;
        --icon: #b2b6ca;
        --accent: #9184d9;
        --accent-text: #b5abfc;
        --accent-on-tint: #d2cefd;
        --accent-deep: #423a6a;
        --divider: #3f424d;
        --hair: rgba(233, 233, 237, 0.07);
        --border: rgba(233, 233, 237, 0.12);
        --border-btn: rgba(233, 233, 237, 0.16);
        --danger: #f28b82;
        --danger-fill: rgba(242, 139, 130, 0.12);
        --danger-edge: rgba(242, 139, 130, 0.4);
        --warning: #e6c17a;
        --warning-fill: rgba(230, 193, 122, 0.12);
        --warning-edge: rgba(230, 193, 122, 0.4);
        --success: #81c995;
        --success-fill: rgba(129, 201, 149, 0.12);
        --success-edge: rgba(129, 201, 149, 0.4);
        --page: #0c0d16;
        --page-text: #cfd3e5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--page-text);
        font:
          14px/1.45 -apple-system,
          'SF Pro Text',
          Inter,
          system-ui,
          sans-serif;
      }
      .layout {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 32px;
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
        color: var(--text);
      }
      .lede {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .flows {
        display: grid;
        gap: 6px;
      }
      .flow-btn {
        all: unset;
        cursor: pointer;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1px solid var(--hair);
        color: var(--text2);
      }
      .flow-btn small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .flow-btn[aria-current='true'] {
        background: var(--accent-tint);
        border-color: var(--accent-deep);
        color: var(--accent-on-tint);
      }
      .flow-btn:focus-visible,
      .step:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent-text);
        outline-offset: 2px;
      }
      .stage {
        display: grid;
        justify-items: center;
        gap: 14px;
      }
      .steps {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
      }
      .step {
        all: unset;
        cursor: pointer;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1px solid var(--hair);
        font-size: 12px;
        color: var(--muted);
      }
      .step[aria-current='true'] {
        background: var(--accent-tint);
        color: var(--accent-on-tint);
        border-color: var(--accent-deep);
      }
      .note {
        max-width: 380px;
        text-align: center;
        color: var(--muted);
        font-size: 12.5px;
        min-height: 2.9em;
      }

      /* phone */
      .phone {
        width: 375px;
        height: 760px;
        background: var(--bg);
        border-radius: 38px;
        border: 8px solid #05060b;
        position: relative;
        overflow: hidden;
        color: var(--text);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .statusbar {
        height: 44px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 26px 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .screen {
        position: absolute;
        inset: 44px 0 0 0;
        display: flex;
        flex-direction: column;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 16px 10px;
      }
      .header h2 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -0.01em;
      }
      .icon-btn {
        all: unset;
        cursor: pointer;
        width: 40px;
        height: 40px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        color: var(--icon);
      }
      .icon-btn:hover {
        background: var(--hair);
      }
      .list {
        overflow: auto;
        flex: 1;
        padding: 0 12px 90px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 8px;
        border-radius: 12px;
      }
      .row + .row {
        border-top: 1px solid var(--hair);
      }
      .tile {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        color: var(--icon);
        flex: none;
      }
      .tile.accent {
        background: var(--accent-tint);
        color: var(--accent-on-tint);
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .title {
        color: var(--text);
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta {
        color: var(--muted);
        font-size: 12.5px;
      }
      .meta.warn {
        color: var(--warning);
      }
      .chip {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 11.5px;
        border: 1px solid var(--border);
        color: var(--text2);
        margin-right: 4px;
      }
      .chip.accent {
        background: var(--accent-tint);
        color: var(--accent-on-tint);
        border-color: var(--accent-deep);
      }
      .tabbar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 74px;
        background: var(--raised);
        border-top: 1px solid var(--hair);
        display: flex;
        justify-content: space-around;
        padding-top: 10px;
        font-size: 11px;
        color: var(--muted);
      }
      .tabbar div {
        display: grid;
        justify-items: center;
        gap: 3px;
      }
      .tabbar .on {
        color: var(--accent-text);
      }
      .dim {
        position: absolute;
        inset: 0;
        background: var(--scrim);
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 88%;
        overflow: auto;
        background: var(--bg);
        border-radius: 22px 22px 0 0;
        border-top: 1px solid var(--border);
        padding: 8px 16px 22px;
        box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.4);
      }
      .grab {
        width: 38px;
        height: 4px;
        background: var(--divider);
        border-radius: 2px;
        margin: 0 auto 10px;
      }
      .sheet h3 {
        margin: 4px 0 2px;
        font-size: 19px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 12px;
        font-size: 13px;
      }
      .menu {
        position: absolute;
        right: 12px;
        top: 96px;
        width: 250px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 6px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      }
      .menu button {
        all: unset;
        cursor: pointer;
        display: flex;
        gap: 10px;
        align-items: center;
        width: calc(100% - 20px);
        padding: 10px;
        border-radius: 10px;
        color: var(--text);
      }
      .menu button:hover {
        background: var(--hair);
      }
      .menu hr {
        border: 0;
        border-top: 1px solid var(--hair);
        margin: 4px 6px;
      }
      button.primary,
      button.secondary,
      button.danger-btn {
        all: unset;
        cursor: pointer;
        box-sizing: border-box;
        display: block;
        text-align: center;
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        font-weight: 600;
        margin-top: 8px;
      }
      button.primary {
        background: var(--accent);
        color: #12101f;
      }
      button.secondary {
        border: 1px solid var(--border-btn);
        color: var(--text2);
      }
      button.danger-btn {
        background: var(--danger-fill);
        border: 1px solid var(--danger-edge);
        color: var(--danger);
      }
      button[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-row {
        display: flex;
        gap: 8px;
      }
      .btn-row > * {
        flex: 1;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
        margin: 8px 0;
      }
      .card.warn {
        background: var(--warning-fill);
        border-color: var(--warning-edge);
      }
      .card.danger {
        background: var(--danger-fill);
        border-color: var(--danger-edge);
      }
      .card.ok {
        background: var(--success-fill);
        border-color: var(--success-edge);
      }
      .counts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin: 8px 0;
      }
      .count {
        background: var(--surface);
        border: 1px solid var(--hair);
        border-radius: 12px;
        padding: 8px;
        text-align: center;
      }
      .count b {
        display: block;
        font-size: 20px;
        color: var(--text);
      }
      .count span {
        font-size: 11.5px;
        color: var(--muted);
      }
      .count.warn b {
        color: var(--warning);
      }
      .count.ok b {
        color: var(--success);
      }
      label.choice {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        margin: 8px 0;
        cursor: pointer;
        background: var(--surface);
      }
      label.choice:has(input:checked) {
        border-color: var(--accent);
        background: var(--accent-tint);
      }
      label.choice b {
        color: var(--text);
        display: block;
      }
      label.choice span {
        color: var(--muted);
        font-size: 12.5px;
      }
      input[type='radio'],
      input[type='checkbox'] {
        accent-color: var(--accent);
        width: 18px;
        height: 18px;
        margin-top: 2px;
      }
      .progress {
        height: 6px;
        border-radius: 3px;
        background: var(--surface);
        overflow: hidden;
        margin: 8px 0;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      .phases {
        list-style: none;
        padding: 0;
        margin: 8px 0;
      }
      .phases li {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 6px 0;
        color: var(--muted);
      }
      .phases li.done {
        color: var(--success);
      }
      .phases li.now {
        color: var(--text);
        font-weight: 600;
      }
      .phases li.fail {
        color: var(--danger);
      }
      .group {
        border-top: 1px solid var(--hair);
        padding: 12px 0;
      }
      .group:first-child {
        border-top: 0;
      }
      .group h4 {
        margin: 0;
        font-size: 15px;
        color: var(--text);
      }
      .files {
        margin: 6px 0;
        padding-left: 16px;
        color: var(--text2);
        font-size: 13px;
      }
      .toast {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 8px;
        background: var(--success-fill);
        border: 1px solid var(--success-edge);
        color: var(--success);
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 13px;
      }
      .folderpick .row {
        cursor: pointer;
      }
      .folderpick .row[aria-selected='true'] {
        background: var(--accent-tint);
      }
      .small {
        font-size: 12px;
        color: var(--muted);
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <h1>Share, backup and restore</h1>
        <p class="lede">
          Mock for the <code>library-bundle-share-backup</code> change.
          Everything here is clickable; nothing is real. Pick a flow, then use
          the steps below the phone or the buttons inside it.
        </p>
        <nav class="flows" id="flows" aria-label="Flows"></nav>
      </aside>
      <main class="stage">
        <div class="phone" id="phone" aria-live="polite"></div>
        <div class="steps" id="steps" role="tablist" aria-label="Steps"></div>
        <div class="note" id="note"></div>
      </main>
    </div>

    <script>
      const I = {
        more: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
        folder:
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
        note: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
        cloud:
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1 0 8z"/></svg>',
        up: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 20h14"/></svg>',
        down: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v12m0 0-4-4m4 4 4-4M5 20h14"/></svg>',
        share:
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15V3m0 0L8 7m4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
        lock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
        mail: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
        check:
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg>',
        dot: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>',
        x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 6 12 12M18 6 6 18"/></svg>',
        back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 5-7 7 7 7"/></svg>',
      };

      /* ---- shared pieces ---- */
      const tabbar =
        '<div class="tabbar"><div>Recents</div><div>Add</div><div class="on">Library</div></div>';
      const statusbar =
        '<div class="statusbar"><span>9:41</span><span>●●●</span></div>';
      const header = (title, right = '') =>
        `<div class="header"><h2>${title}</h2><div>${right}</div></div>`;
      const row = (icon, title, meta, extra = '', accent = false) =>
        `<div class="row"><div class="tile ${accent ? 'accent' : ''}">${icon}</div><div class="grow"><div class="title">${title}</div><div class="meta">${meta}</div></div>${extra}</div>`;
      const sheet = (body, onDim = '') =>
        `<div class="dim" ${onDim}></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${body}</div>`;
      const nav = (id) => `data-go="${id}"`;

      /* Library screen, optionally with an import-folder mark / needs-access rows */
      const library = (opts = {}) => `${statusbar}<div class="screen">
  ${header('Library', `<button class="icon-btn" aria-label="Library actions" ${nav(opts.menu || 'menu')}>${I.more}</button>`)}
  <div class="list">
    ${opts.imported ? row(I.folder, 'Imported Messiah 2026-11-09', '<span class="chip accent">Imported from Dana Director</span>', '', true) : ''}
    ${row(I.folder, 'Messiah', '14 tracks · 3 loops')}
    ${row(I.folder, 'Christmas concert', '9 tracks · 2 playlists')}
    ${row(I.note, 'Warm-up scales', '2:10')}
  </div>${tabbar}${opts.overlay || ''}</div>`;

      /* ---- flows ---- */
      const flows = [
        {
          id: 'backup',
          title: 'Back up library',
          sub: 'Library menu → write a dated bundle to Drive',
          steps: [
            {
              name: 'Entry',
              note: 'Backup lives in the Library overflow menu with Restore and Import. Share is on each folder (see Share flow).',
              render: () =>
                library({
                  overlay: `<div class="dim" ${nav('close')}></div><div class="menu">
        <button ${nav('confirm')}>${I.up} Back up library</button>
        <button ${nav('restore')}>${I.down} Restore from backup</button>
        <button ${nav('import')}>${I.cloud} Import shared library</button></div>`,
                }),
            },
            {
              name: 'Needs write permission',
              note: 'Only when the session lacks drive.file. Accepting starts sign-in with the write scope; nothing is written yet.',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Allow saving to Drive</h3><p class="sub">Back up needs permission to save files it creates in your Drive. It can't see or change your other files.</p>
        <div class="card">${I.lock} <span class="small">Only the “Choir LMS” folder the app creates is written to.</span></div>
        <button class="primary" ${nav('confirm')}>Allow saving to Drive</button><button class="secondary" ${nav('close')}>Not now</button>`),
                }),
            },
            {
              name: 'Confirm',
              note: 'Recordings are off by default. The size total updates as you tick, before anything uploads. Recordings already on Drive cost nothing.',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Back up library</h3><p class="sub">Saved to Drive in <b>Choir LMS / Backups</b> as <span class="chip">choir-lms-backup-2026-11-09T1530</span></p>
        <div class="counts"><div class="count"><b>46</b><span>tracks</span></div><div class="count"><b>12</b><span>loops</span></div><div class="count"><b>5</b><span>playlists</span></div></div>
        <div class="card"><b style="color:var(--text)">Recordings</b><div class="small">None are included unless you choose them.</div>
          <label class="choice"><input type="checkbox" data-rec="1" data-size="3.1"><div><b>Recording 1 · Soprano, bar 5–9</b><span>3.1 MB · will upload</span></div></label>
          <label class="choice"><input type="checkbox" data-rec="1" data-size="0"><div><b>Recording 2 · Soprano</b><span>On Drive already · no upload</span></div></label>
          <div class="small" id="recTotal">No audio will be uploaded.</div></div>
        <p class="small">Backups are kept for your 5 most recent; older ones are removed after a new one is saved.</p>
        <button class="primary" ${nav('progress')}>Back up</button><button class="secondary" ${nav('close')}>Cancel</button>`),
                }),
            },
            {
              name: 'Saving',
              note: 'Cancel is always available. A cancelled or failed upload leaves no partial file listed.',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Saving backup…</h3><div class="progress"><i style="width:62%"></i></div>
        <ul class="phases"><li class="done">${I.check} Folders ready</li><li class="now">${I.dot} Uploading library file</li><li>${I.dot} Removing backups beyond 5</li></ul>
        <button class="secondary" ${nav('failed')}>Cancel</button>`),
                }),
            },
            {
              name: 'Done',
              note: 'Plain statement of where it went. No claim about permissions or sharing.',
              render: () =>
                library({
                  overlay: `<div class="toast">${I.check} Backed up to Choir LMS / Backups</div>`,
                }),
            },
            {
              name: 'Failed',
              note: 'Nothing half-written. Try again keeps the same choices.',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Backup didn't finish</h3><div class="card danger"><span style="color:var(--danger)">You appear to be offline.</span><div class="small">Nothing was saved, and your earlier backups are untouched.</div></div>
        <button class="primary" ${nav('confirm')}>Try again</button><button class="secondary" ${nav('close')}>Close</button>`),
                }),
            },
          ],
        },
        {
          id: 'restore',
          title: 'Restore a backup',
          sub: 'Add to my library, or Replace with a safety backup',
          steps: [
            {
              name: 'Backups',
              note: 'Own backups newest first, with date and counts. Pre-restore backups are labelled so Undo is findable. With none: “No backups yet” and Back up now.',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Restore from backup</h3><p class="sub">From Choir LMS / Backups</p>
        ${row(I.down, 'Backup · 9 Nov 2026, 15:30', '46 tracks · 12 loops · 5 playlists · 1.2 MB', '', true).replace('class="row"', `class="row" ${nav('choose')} style="cursor:pointer"`)}
        ${row(I.down, 'Before restore · 2 Nov 2026, 09:12', '44 tracks · 11 loops · 2 recordings', '<span class="chip">Undo</span>').replace('class="row"', `class="row" ${nav('choose')} style="cursor:pointer"`)}
        ${row(I.down, 'Backup · 1 Nov 2026, 08:01', '43 tracks · 11 loops · 5 playlists', '').replace('class="row"', `class="row" ${nav('choose')} style="cursor:pointer"`)}

            {
              name: 'Empty',
              note: 'No backups.',

                library({
                  overlay: sheet(
                    `<h3>Restore from backup</h3><div class="card"><b style="color:var(--text)">No backups yet</b><div class="small">Back up your library to keep a copy you can restore later.</div></div><button class="primary" ${nav('backup-confirm')}>Back up now</button>`,

            {

        <button class="primary" id="chooseGo" disabled>Continue</button>`),

            },
            {
              name: 'Confirm replace',
              note: 'Names what is lost, what is in the backup, and the safety backup. Destructive button is red and worded as the action.',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Replace your library?</h3>
        <div class="card danger"><span style="color:var(--danger)">Everything in your library will be replaced</span><div class="small">The backup holds 46 tracks, 12 loops, 5 playlists and 2 recordings.</div></div>
        <p class="small">First, a backup of your current library — including all your recordings (12.4 MB to upload) — is saved to Choir LMS / Backups. If that fails, nothing changes.</p>
        <button class="danger-btn" ${nav('progress')}>Back up, then replace</button><button class="secondary" ${nav('close')}>Cancel</button>`),

            {
              name: 'Replacing',
              note: 'Order matters: safety backup first, then one swap. Interrupting is safe: the next load finishes or rolls back.',

                library({

            {
              name: 'Replaced',

              render: () =>
                library({

        <h3>Library replaced</h3><div class="card ok"><span style="color:var(--success)">Your library is now the 9 Nov backup.</span></div>

        },
        {
          id: 'share',
          title: 'Share a folder',
          sub: 'Folder menu → bundle in Choir LMS / Shares',
          steps: [
            {
              name: 'Folder menu',

              render: () =>

            },
            {
              name: 'Preview',
              note: 'Counts update live. By default items from other folders are left out and counted; the checkbox includes them instead (off by default, because it shares more than the folder).',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Share “Messiah”</h3><p class="sub">A file with the folder’s tracks, loops, playlists and composites. No audio is copied.</p>
        <div class="counts"><div class="count"><b id="cTracks">14</b><span>tracks</span></div><div class="count"><b id="cLoops">3</b><span>loops</span></div><div class="count"><b>1</b><span>playlist</span></div><div class="count"><b>2</b><span>composites</span></div><div class="count warn" id="cLeftBox"><b id="cLeft">4</b><span>left out</span></div></div>
        <div class="card warn" id="outsideCard"><span style="color:var(--warning)">4 references to items outside this folder were left out.</span><div class="small">For example “Tonight” also plays 3 tracks from Christmas concert, so it will have gaps.</div></div>
        <label class="choice"><input type="checkbox" id="includeOutside"><div><b>Include the items its playlists use from other folders</b><span>Adds 4 tracks from Christmas concert at the top of the share, so “Tonight” and the composite play in full. Everyone who opens the file sees their names and tags.</span></div></label>
        <label class="choice"><input type="checkbox"><div><b>Include my recordings</b><span>Off by default. Recordings are your own voice — only share them on purpose. Choose which ones next.</span></div></label>
        <button class="primary" ${nav('done')}>Save to Drive</button><button class="secondary" ${nav('close')}>Cancel</button>`),
                }),
            },
            {
              name: 'Saved',
              note: 'The app never changes permissions: it tells the user what to do in Drive, and that singers also need the audio files.',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Ready to share</h3><div class="card ok"><span style="color:var(--success)">Saved to Choir LMS / Shares</span><div class="small">choir-lms-share-Messiah 2026-11-09T1530.json</div></div>
        <p class="sub">Open it in Drive and share it with your singers. They also need access to the audio files themselves — share the Drive folder that holds them if they don't have it yet.</p>
        <button class="primary">Open in Drive</button><button class="secondary" ${nav('close')}>Done</button>`),
                }),
            },
          ],
        },
        {
          id: 'import',
          title: 'Import a shared library',
          sub: 'Pick a bundle → preview → destination → progress',
          steps: [
            {
              name: 'Bundles',
              note: 'Own Backups/Shares plus Shared with me, newest first. Found by marker, or by name if a copy lost it.',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Import shared library</h3><p class="sub">Bundles from your Drive and shared with you</p>
        <div class="small" style="margin:6px 0">Shared with me</div>
        ${row(I.cloud, 'Messiah', 'Dana Director · 9 Nov 2026 · 14 tracks', '', true).replace('class="row"', `class="row" ${nav('preview')} style="cursor:pointer"`)}
        ${row(I.cloud, 'Christmas concert', 'Dana Director · 2 Nov 2026 · 9 tracks', '').replace('class="row"', `class="row" ${nav('preview')} style="cursor:pointer"`)}
        <div class="small" style="margin:10px 0 6px">My bundles</div>
        ${row(I.down, 'Backup · 9 Nov 2026', 'Your backup · 46 tracks', '').replace('class="row"', `class="row" ${nav('preview')} style="cursor:pointer"`)}`),
                }),
            },
            {
              name: 'Preview',
              note: 'Nothing is written yet. Damaged items are mentioned plainly; needs-access is a heads-up, not a blocker. Works with read-only access.',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Messiah</h3><p class="sub">From Dana Director · 9 Nov 2026</p>
        <div class="counts"><div class="count ok"><b>11</b><span>new tracks</span></div><div class="count"><b>3</b><span>already yours</span></div><div class="count"><b>3</b><span>loops</span></div><div class="count"><b>1</b><span>playlist</span></div><div class="count"><b>2</b><span>composites</span></div><div class="count warn"><b>2</b><span>need access</span></div></div>
        <div class="card warn"><span style="color:var(--warning)">2 files can't be opened yet.</span><div class="small">They'll still be imported; you can ask the owner to share them afterwards.</div></div>
        <div class="small">1 damaged item was skipped.</div>
        <button class="primary" ${nav('where')}>Choose where to add it</button><button class="secondary" ${nav('close')}>Cancel</button>`),
                }),
            },
            {
              name: 'Destination',
              note: 'Always additive: a new “Imported Messiah 2026-11-09” folder is created here; nothing existing changes.',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Add to…</h3><p class="sub">A new folder is created here. Your existing folders and tracks are not changed.</p>
        <div class="folderpick card">
          <div class="row" aria-selected="true">${I.folder}<div class="grow"><div class="title">Library</div></div>${I.check}</div>
          <div class="row">${I.folder}<div class="grow"><div class="title">Messiah</div></div></div>
          <div class="row">${I.folder}<div class="grow"><div class="title">Christmas concert</div></div></div></div>
        <button class="primary" ${nav('progress')}>Add here</button><button class="secondary" ${nav('close')}>Cancel</button>`),
                }),
            },
            {
              name: 'Importing',
              note: 'Phases with cancel. Cancelling or failing leaves a valid library; trying again does not duplicate.',
              render: () =>
                library({
                  overlay: sheet(`
        <h3>Adding Messiah…</h3><div class="progress"><i style="width:58%"></i></div>
        <ul class="phases"><li class="done">${I.check} Checking which files you can open</li><li class="done">${I.check} Tracks</li><li class="now">${I.dot} Loops and playlists</li><li>${I.dot} Folders</li></ul>
        <button class="secondary" ${nav('done')}>Cancel</button>`),
                }),
            },
            {
              name: 'Done',
              note: 'The new root folder carries “Imported from <author>”; rows inside stay quiet. A card points at the access guide.',
              render: () =>
                library({
                  imported: true,
                  overlay: `<div class="toast" style="background:var(--warning-fill);border-color:var(--warning-edge);color:var(--warning)">Added Messiah · 2 files need access <button style="all:unset;cursor:pointer;text-decoration:underline;margin-left:6px" ${nav('../access/0')}>See which</button></div>`,
                }),
            },
          ],
        },
        {
          id: 'access',
          title: 'Missing access',
          sub: 'Guide, row state and recovery',
          steps: [
            {
              name: 'Guide',
              note: 'Grouped by owner (bundle author when unknown). Wording never claims a cause: Drive says the same for deleted and unshared.',
              render: () =>
                library({
                  imported: true,
                  overlay: sheet(`
        <h3>2 files need access</h3><p class="sub">Can't open these yet. Ask the owner to share them.</p>
        <div class="card"><span class="small">These 2 are in “Soprano parts” on Dana Director's Drive — ask for the folder once.</span></div>
        <div class="group"><h4>Dana Director <span class="small">dana@example.com</span></h4><ul class="files"><li>Soprano 1.mp3</li><li>Soprano 2.mp3</li></ul>
          <div class="btn-row"><button class="secondary" data-toast="Opens Drive's file page, where you can use Request access">Open in Drive</button><button class="secondary" data-toast="Opens a message to dana@example.com with the file names and links">${I.mail} Email owner</button></div></div>
        <div class="btn-row"><button class="secondary" data-toast="Names and links copied">Copy list</button><button class="primary" ${nav('after')}>Check again</button></div>`),
                }),
            },
            {
              name: 'Row state',
              note: 'Needs-access rows are dimmed, say why, and offer Open in Drive / Remove. Playback is blocked with the clear message; loops and playlist links are kept.',
              render:
                () => `${statusbar}<div class="screen">${header('Soprano parts', `<button class="icon-btn" ${nav('close')}>${I.back}</button>`)}
        <div class="list">
          ${row(I.lock, 'Soprano 1.mp3', '<span class="meta warn">Can\'t open. Ask the owner to share it.</span>', '<span class="chip">Open in Drive</span>')}
          ${row(I.lock, 'Soprano 2.mp3', '<span class="meta warn">Can\'t open. Ask the owner to share it.</span>', '<span class="chip">Open in Drive</span>')}
          ${row(I.note, 'Soprano 3.mp3', '3:02 · 1 loop')}
        </div><div class="toast" style="background:var(--warning-fill);border-color:var(--warning-edge);color:var(--warning);top:auto;bottom:90px">“Soprano 1.mp3” can't be opened. It needs to be shared with you by its owner.</div>${tabbar}</div>`,
            },
            {
              name: 'After check',
              note: 'Recovered files become normal; the rest stay listed. Loops and links are untouched.',
              render: () =>
                library({
                  imported: true,
                  overlay: sheet(`
        <h3>1 file still needs access</h3><div class="card ok"><span style="color:var(--success)">${I.check} Soprano 1.mp3 can be opened now.</span></div>
        <div class="group"><h4>Dana Director</h4><ul class="files"><li>Soprano 2.mp3</li></ul></div>
        <button class="secondary" ${nav('close')}>Close</button>`),
                }),
            },
          ],
        },
      ];

      /* ---- engine ---- */
      let flow = flows[0],
        step = 0;
      const $ = (s) => document.querySelector(s);
      function draw() {
        const s = flow.steps[step];
        $('#phone').innerHTML = s.render();
        $('#note').textContent = s.note;
        $('#flows').innerHTML = flows
          .map(
            (f) =>
              `<button class="flow-btn" data-flow="${f.id}" aria-current="${f === flow}">${f.title}<small>${f.sub}</small></button>`,
          )
          .join('');
        $('#steps').innerHTML = flow.steps
          .map(
            (x, i) =>
              `<button class="step" data-step="${i}" aria-current="${i === step}">${i + 1}. ${x.name}</button>`,
          )
          .join('');
        document.title = `${flow.title} · ${s.name} (mock)`;
        wire();
      }
      function jump(id) {
        if (id === 'close') {
          step = 0;
          return draw();
        }
        if (id.startsWith('../')) {
          const [f, i] = id.slice(3).split('/');
          flow = flows.find((x) => x.id === f);
          step = +i;
          return draw();
        }
        if (id === 'backup-confirm') {
          flow = flows[0];
          step = 2;
          return draw();
        }
        const names = {
          menu: 0,
          confirm: 2,
          progress: 3,
          failed: 5,
          restore: 0,
          choose: 2,
          empty: 1,
          fail: 5,
          preview: 1,
          done: 2,
          where: 2,
          import: 0,
          after: 2,
        };
        // flow-specific meaning of shared ids
        const per =
          {
            backup: {
              menu: 0,
              confirm: 2,
              progress: 3,
              failed: 5,
              restore: null,
              import: null,
            },
            restore: { choose: 2, empty: 1, progress: 4, fail: 5, confirm: 3 },
            share: { preview: 1, done: 2 },
            import: { preview: 1, where: 2, progress: 3, done: 4 },
            access: { after: 2 },
          }[flow.id] || {};
        if (id === 'restore') {
          flow = flows[1];
          step = 0;
          return draw();
        }
        if (id === 'import') {
          flow = flows[3];
          step = 0;
          return draw();
        }
        if (flow.id === 'restore' && id === 'choose') {
          step = 2;
          return draw();
        }
        const target = per[id] ?? names[id];
        if (target != null) {
          step = target;
          draw();
        }
      }
      function wire() {
        document
          .querySelectorAll('[data-go]')
          .forEach((el) =>
            el.addEventListener('click', () => jump(el.dataset.go)),
          );
        document.querySelectorAll('[data-flow]').forEach((el) =>
          el.addEventListener('click', () => {
            flow = flows.find((f) => f.id === el.dataset.flow);
            step = 0;
            draw();
          }),
        );
        document.querySelectorAll('[data-step]').forEach((el) =>
          el.addEventListener('click', () => {
            step = +el.dataset.step;
            draw();
          }),
        );
        document.querySelectorAll('[data-toast]').forEach((el) =>
          el.addEventListener('click', () => {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = el.dataset.toast;
            $('#phone').appendChild(t);
            setTimeout(() => t.remove(), 2200);
          }),
        );
        const outside = $('#includeOutside');
        if (outside)
          outside.addEventListener('change', () => {
            const on = outside.checked;
            $('#cTracks').textContent = on ? 18 : 14;
            $('#cLeft').textContent = on ? 0 : 4;
            $('#cLeftBox').classList.toggle('warn', !on);
            $('#outsideCard').className = on ? 'card ok' : 'card warn';
            $('#outsideCard').innerHTML = on
              ? '<span style="color:var(--success)">Nothing is left out.</span><div class="small">4 tracks from Christmas concert are added so the playlist and composite are complete.</div>'
              : '<span style="color:var(--warning)">4 references to items outside this folder were left out.</span><div class="small">For example “Tonight” also plays 3 tracks from Christmas concert, so it will have gaps.</div>';
          });
        const recs = document.querySelectorAll('[data-rec]');
        recs.forEach((r) =>
          r.addEventListener('change', () => {
            const mb = [...recs]
              .filter((x) => x.checked)
              .reduce((n, x) => n + Number(x.dataset.size), 0);
            const any = [...recs].some((x) => x.checked);
            $('#recTotal').textContent = !any
              ? 'No audio will be uploaded.'
              : mb === 0
                ? 'Included. Already on Drive, so nothing extra uploads.'
                : `${mb.toFixed(1)} MB of recording audio will be uploaded.`;
          }),
        );
        const go = $('#chooseGo');
        if (go) {
          const radios = document.querySelectorAll('input[name=how]');
          radios.forEach((r) =>
            r.addEventListener('change', () => {
              go.disabled = false;
            }),
          );
          go.addEventListener('click', () => {
            const v = document.querySelector('input[name=how]:checked').value;
            v === 'replace' ? (step = 3) : ((flow = flows[3]), (step = 2));
            draw();
          });
        }
      }
      draw();
    </script>
  </body>
</html>
